
name: Deploy Flutter Web

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      archive_ref:
        description: "Tag or commit SHA to archive"
        required: true
        type: string
      archive_name:
        description: "Archive folder name, e.g. archive-initial"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Validate archive name
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: |
          if [[ ! "$ARCHIVE_NAME" =~ ^[a-zA-Z0-9._-]+$ ]] ||
             [[ "$ARCHIVE_NAME" == "." ]] ||
             [[ "$ARCHIVE_NAME" == ".." ]]; then
            echo "Invalid archive name: $ARCHIVE_NAME"
            exit 1
          fi

      - name: Checkout selected old version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.archive_ref }}
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: source
        run: flutter pub get

      - name: Build archived version
        working-directory: source
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: |
          flutter build web --release \
            --base-href "/school_tasks/versions/${ARCHIVE_NAME}/"

      - name: Checkout archive storage
        uses: actions/checkout@v4
        with:
          ref: web-archive
          path: archive-store
          fetch-depth: 0

      - name: Save archived version
        env:
          ARCHIVE_NAME: ${{ inputs.archive_name }}
        run: |
          if [ -e "archive-store/versions/${ARCHIVE_NAME}" ]; then
            echo "Archive already exists: ${ARCHIVE_NAME}"
            echo "Choose another name to avoid overwriting it."
            exit 1
          fi

          mkdir -p "archive-store/versions/${ARCHIVE_NAME}"
          cp -R source/build/web/. \
            "archive-store/versions/${ARCHIVE_NAME}/"

          git -C archive-store config user.name "github-actions[bot]"
          git -C archive-store config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C archive-store add "versions/${ARCHIVE_NAME}"
          git -C archive-store commit \
            -m "Archive web version ${ARCHIVE_NAME}"
          git -C archive-store push origin HEAD:web-archive

  build:
    needs: archive
    if: always() && (needs.archive.result == 'success' || needs.archive.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build main website
        run: flutter build web --release --base-href /school_tasks/

      - name: Checkout archive storage
        uses: actions/checkout@v4
        with:
          ref: web-archive
          path: archive-store

      - name: Include archived versions
        run: |
          mkdir -p build/web/versions
          if [ -d archive-store/versions ]; then
            cp -R archive-store/versions/. build/web/versions/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
