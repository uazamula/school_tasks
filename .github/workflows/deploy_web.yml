
name: Deploy Flutter Web

on:
  push:
    branches:
      - master
    tags:
      - 'archive-*'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  archive:
    if: startsWith(github.ref, 'refs/tags/archive-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build archived version
        env:
          ARCHIVE_TAG: ${{ github.ref_name }}
        run: |
          flutter build web --release \
            --base-href "/school_tasks/versions/${ARCHIVE_TAG}/"

      - name: Checkout archive storage
        uses: actions/checkout@v4
        with:
          ref: web-archive
          path: archive-store
          fetch-depth: 0

      - name: Save archived version
        env:
          ARCHIVE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "archive-store/versions/${ARCHIVE_TAG}"
          cp -R build/web/. "archive-store/versions/${ARCHIVE_TAG}/"

          git -C archive-store config user.name "github-actions[bot]"
          git -C archive-store config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C archive-store add "versions/${ARCHIVE_TAG}"
          git -C archive-store commit -m "Archive web version ${ARCHIVE_TAG}"
          git -C archive-store push origin HEAD:web-archive

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build main website
        run: flutter build web --release --base-href /school_tasks/

      - name: Checkout archive storage
        uses: actions/checkout@v4
        with:
          ref: web-archive
          path: archive-store

      - name: Include archived versions
        run: |
          mkdir -p build/web/versions
          if [ -d archive-store/versions ]; then
            cp -R archive-store/versions/. build/web/versions/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: always() && (needs.archive.result == 'success' || needs.archive.result == 'skipped') && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs:
      - archive
      - build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
